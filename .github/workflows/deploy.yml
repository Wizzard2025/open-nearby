# Обновляет данные о магазинах каждую ночь и публикует сайт на GitHub Pages.
name: Update data & deploy
on:
  schedule: [{ cron: "0 1 * * *" }]   # 03:00–04:00 по Израилю
  workflow_dispatch:
  push: { branches: [main] }
# Least privilege: nothing by default, each job asks only for what it uses.
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }   # commits the refreshed data
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved to other code); the tag is in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      # On a code push the committed data is used as is; the nightly run refreshes it.
      # If a data source is down, the site still deploys with yesterday's data.
      - name: Download shops (OpenStreetMap + chain branch hours)
        if: github.event_name != 'push'
        continue-on-error: true
        run: pip install --quiet duckdb==2.0.0 && python tools/update_data.py && python tools/coverage.py
      - name: Commit fresh data
        if: github.event_name != 'push'
        run: |
          git config user.name "data-bot"; git config user.email "data-bot@users.noreply.github.com"
          git add data/shops.json data/tiles data/geocache.json data/geocache2.json data/chains data/registries data/coverage.json && git commit -m "Update shop data" || echo "no changes"
          git push || true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: { path: . }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
