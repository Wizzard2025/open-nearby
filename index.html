<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e141a">
<title>בטוח? פתוח! · Точно открыто</title>
<meta name="description" content="לא צריך לחפש מה פתוח. כל החנויות, בתי המרקחת, המאפיות ותחנות הדלק שפתוחים עכשיו לידך, על מפה אחת. Точно открыто: все открытые магазины рядом на одной карте. Betcha it's open: every open shop near you on one map.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="בטוח? פתוח! · Betcha it's open">
<meta property="og:title" content="בטוח? פתוח! · לא צריך לחפש מה פתוח">
<meta property="og:description" content="הנה כולם, על מפה אחת: סופר, בית מרקחת, מאפייה ותחנת דלק שפתוחים עכשיו לידך. כולל שבת וחגים. Точно открыто · Betcha it's open">
<meta property="og:locale" content="he_IL">
<meta property="og:locale:alternate" content="ru_RU">
<meta property="og:locale:alternate" content="en_US">
<meta property="og:image" content="https://betahopen.app/img/og.png?v=4">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://betahopen.app/">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/favicon.ico" sizes="48x48">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script>(function(){try{var m=localStorage.getItem("theme");if(m==="light"||m==="dark")document.documentElement.setAttribute("data-theme",m)}catch(e){}})();</script>
<link rel="stylesheet" href="style.css?v=20261120c">
<script data-goatcounter="https://open-nearby.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<div id="map" role="region" aria-label="Карта"></div>

<header class="topbar">
  <div class="brand">
    <span class="logo-tile"><picture>
      <source srcset="img/logo-sloth.webp" type="image/webp">
      <img src="img/logo-sloth.png" width="85" height="66" alt="בטוח? פתוח!" lang="he">
    </picture></span>
    <span class="appname" data-i18n="tagline">Точно открыто</span>
  </div>
  <button type="button" class="themebtn" id="accBtn" aria-label="Account" aria-expanded="false" aria-controls="accPop"></button>
  <div class="accpop" id="accPop" hidden></div>
  <button type="button" class="themebtn" id="themeBtn" aria-label="Theme"></button>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-lang="he">עב</button>
    <button type="button" data-lang="ru">RU</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<div class="glance" id="glance">
  <button type="button" class="answer" id="answerBtn" aria-controls="sheet">
    <b id="gCount">—</b><span id="gText"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button type="button" class="tiltbtn" id="tiltBtn" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 20.5 7.5v9L12 21.2 3.5 16.5v-9zM3.5 7.5 12 12.2l8.5-4.7M12 12.2v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>3D</span>
  </button>
</div>
<div class="shadebar" id="shadeBar" hidden>
  <span class="sb-sun" aria-hidden="true">☀</span>
  <input type="range" id="shadeTime" min="0" max="1435" step="5" aria-label="Time">
  <span class="sb-time" id="shadeTimeL"></span>
  <button type="button" class="sb-now" id="shadeNow"></button>
</div>
<div class="mapctl">
  <div class="layers-pop" id="layersPop" hidden>
    <p class="lp-title" id="lpTitle"></p>
    <label><input type="checkbox" id="lyShops"> <span id="lyShopsL"></span></label>
    <label><input type="checkbox" id="lyParking"> <span id="lyParkingL"></span></label>
    <label><input type="checkbox" id="lyRings"> <span id="lyRingsL"></span></label>
    <label><input type="checkbox" id="lyShade"> <span id="lyShadeL"></span></label>
  </div>
  <button type="button" id="layersBtn" class="fab" aria-expanded="false" aria-controls="layersPop" aria-label="Layers">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 8 12 13l9.5-5zM2.5 12.2 12 17.2l9.5-5M2.5 16.2 12 21.2l9.5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
  <button type="button" id="locate" class="fab" aria-label="Near me">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4.5 20.3l.7.7L12 18l6.8 3 .7-.7z" fill="currentColor" transform="rotate(45 12 12)"/></svg>
  </button>
</div>

<section class="sheet" id="sheet" data-state="peek" aria-label="Список мест">
  <button type="button" class="grab" id="grab" aria-label="Развернуть список"><span></span></button>

  <div class="hero">
    <div class="hero-main">
      <p class="kicker" id="kicker">Сейчас открыто</p>
      <p class="bignum"><span id="openCount">—</span> <span class="bigunit" id="openUnit">мест</span></p>
      <p class="where" id="whereLine"></p>
    </div>
    <select id="city" aria-label="City"></select>
  </div>

  <div class="routebox" id="routeBox" hidden>
    <div class="route-main">
      <p class="route-title" id="routeTitle"></p>
      <p class="route-sub" id="routeSub"></p>
    </div>
    <button type="button" class="shadebtn" id="shadeBtn" aria-pressed="false"></button>
    <button type="button" class="xbtn" id="routeClose" aria-label="Close">×</button>
  </div>

  <div class="chips" role="group" id="cats"></div>
  <div id="notices"></div>
  <div class="adbanner" id="adBanner" data-ad-slot="banner" hidden></div>
  <div class="cards" id="cards"></div>

  <form class="addbox" id="addBox" hidden autocomplete="off">
    <p class="add-title" id="addTitle"></p>
    <p class="add-hint" id="addHint"></p>
    <div id="addFields" hidden>
      <input id="addName" required maxlength="60">
      <div class="add-row">
        <select id="addType"></select>
      </div>
      <div class="add-hours" id="addHours" role="radiogroup"></div>
      <input id="addHoursText" hidden maxlength="80">
      <div class="add-actions">
        <button type="submit" class="walk" id="addSend"></button>
        <button type="button" class="ghost" id="addCancel"></button>
      </div>
      <p class="add-note" id="addNote"></p>
    </div>
  </form>

  <div class="scroller" id="scroller">
    <ol id="list" class="list"></ol>
    <details id="unknownBox" class="fold" hidden>
      <summary id="unknownTitle"></summary>
      <p class="foldnote" data-i18n="unknownNote"></p>
      <ol id="unknownList" class="list"></ol>
    </details>
    <details id="closedBox" class="fold" hidden>
      <summary id="closedTitle"></summary>
      <ol id="closedList" class="list"></ol>
    </details>
    <button type="button" class="addcta" id="addOpen"></button>
    <p class="source"><span data-i18n="source"></span> <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a> · <a href="https://overturemaps.org" target="_blank" rel="noopener">© Overture Maps Foundation</a> · <a href="https://data.gov.il" target="_blank" rel="noopener">data.gov.il</a></p>
    <p class="madeby">made by <b>Vichi</b> · 2026</p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="vendor/suncalc.js"></script>
<script src="vendor/opening_hours.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="community.js?v=20261120c"></script>
<script src="mapkit.js?v=20261120c"></script>
<script src="route.js?v=20261120c"></script>
<script src="app.js?v=20261120c"></script>
</body>
</html>
