# SonarQube analysis settings (local instance: tools/sonar/sonar.py). The version is passed by sonar.py.
sonar.projectKey=open-nearby
sonar.projectName=בטוח? פתוח! (open-nearby)
sonar.sourceEncoding=UTF-8
sonar.sources=.
# Not analysed as source:
#   data/      generated shop data (JSON, hundreds of MB of tiles)
#   vendor/    third-party libraries; checked for known CVEs by tools/sonar/deps_check.py instead
#   img/, brand/ binary assets, rendered ads and brand-book HTML exports; marketing/ copy
sonar.exclusions=data/**,vendor/**,img/**,brand/**/*.png,brand/**/*.jpg,brand/**/*.webp,brand/**/*.svg,marketing/**,.sonar/**,**/__pycache__/**
sonar.python.version=3.12
# Workflows live in a hidden directory; analyse them too (GitHub Actions security rules).
sonar.scanner.excludeHiddenFiles=false
# Globals defined by other <script> tags (see index.html): libraries and the app's own modules.
sonar.javascript.globals=maplibregl,supabase,opening_hours,SunCalc,MK,DB,Route,goatcounter,I18N
# The translation tables are three parallel copies of the same keys by design; skip them in duplicate detection.
sonar.cpd.exclusions=i18n.js
