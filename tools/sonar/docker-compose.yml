# Local SonarQube Community Build for release scans. Started and configured by tools/sonar/sonar.py.
# Listens on 127.0.0.1 only. Passwords come from .sonar/.env (generated, git-ignored).
name: open-nearby-sonar
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?run tools/sonar/sonar.py up}
      POSTGRES_DB: sonar
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  sonarqube:
    image: sonarqube:26.11.0.134175-community
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
      SONAR_TELEMETRY_ENABLE: "false"
      # Empty by default. sonar.py sets it only on a host with little free disk (Elasticsearch refuses to start below 10%).
      SONAR_SEARCH_JAVAADDITIONALOPTS: ${SONAR_ES_OPTS:-}
      # Normally false. Only for a sandbox that cannot give Elasticsearch 65535 open files (see sonar.py up).
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: ${SONAR_ES_BOOTSTRAP_CHECKS_DISABLE:-false}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - data:/opt/sonarqube/data
      - extensions:/opt/sonarqube/extensions
      - logs:/opt/sonarqube/logs
    restart: unless-stopped

volumes:
  db:
  data:
  extensions:
  logs:
